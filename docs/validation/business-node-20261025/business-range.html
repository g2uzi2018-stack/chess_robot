<h1>业务节点 · 规划与实机证据</h1>
<p>蓝色圆点：仅规划通过；橙色叉号：规划拒绝；绿色方点：真实反馈确认到位；紫色空心点：取消后确认停止。<span id="counts"></span></p>
<button id="global">全范围</button><button id="local">实机邻域</button><div id="chart" aria-label="可旋转的三维规划和实机点位证据"></div>
