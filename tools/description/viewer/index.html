<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nova5 + AG95 · 模型查看</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,"Noto Sans CJK SC",sans-serif;color:#dce5f1;background:#0b1220}main{display:grid;grid-template-columns:300px 1fr;height:100vh}aside{padding:28px 22px;background:#111c2c;border-right:1px solid #25364e;overflow:auto}h1{font-size:25px;margin:0 0 4px;letter-spacing:-.7px}p{color:#9badc5;margin:0 0 22px}.tag{font-size:11px;letter-spacing:2px;color:#6bd5c5;margin-bottom:12px}label{display:block;margin:19px 0 7px;color:#b5c4d9;font-size:12px}select,button{font:inherit;color:inherit;background:#1a2b42;border:1px solid #33465f;border-radius:7px;padding:9px;cursor:pointer}select{width:100%}button:hover{border-color:#6bd5c5}button:disabled{opacity:.4;cursor:default}.row{display:flex;gap:6px;flex-wrap:wrap}.row button{flex:1;padding:7px 5px;font-size:12px}.joint{margin:17px 0}.joint label{display:flex;justify-content:space-between;margin:0 0 6px}.joint output{color:#6bd5c5;font-variant-numeric:tabular-nums}.joint input{width:100%;accent-color:#6bd5c5}hr{border:0;border-top:1px solid #25364e;margin:24px 0}.check{display:flex;align-items:center;gap:8px;margin:13px 0}.check input{accent-color:#6bd5c5}.note{font-size:12px;line-height:1.7;color:#9badc5;margin-top:24px}#viewport{position:relative;min-width:0;overflow:hidden}canvas{display:block}#status{position:absolute;left:25px;top:22px;max-width:calc(100% - 50px);padding:9px 13px;background:#111c2ce6;border:1px solid #33465f;border-radius:8px;pointer-events:none;font-size:12px}#hint{position:absolute;bottom:20px;left:25px;color:#8ea3bf;font-size:12px;pointer-events:none}.legend{color:#6bd5c5;font-size:12px;margin-top:12px}@media(max-width:700px){main{grid-template-columns:240px 1fr}aside{padding:18px 14px}h1{font-size:21px}}
  </style>
</head>
<body>
<main>
  <aside>
    <div class="tag">CHESS ROBOT / MODEL</div>
    <h1>Nova5 + AG95</h1>
    <p>机械臂与末端夹爪</p>
    <label for="model">查看模型</label>
    <select id="model"><option value="nova5_with_ag95.urdf">机械臂 + 夹爪 + 支架</option><option value="ag95.urdf">仅 AG95 夹爪</option></select>
    <label for="mode">显示方式</label>
    <select id="mode"><option value="visual">外观</option><option value="collision">碰撞几何</option><option value="both">外观 + 碰撞</option></select>
    <label class="check"><input id="tcp" type="checkbox" checked>显示抓取坐标系</label>
    <div class="legend">坐标轴：X 红 · Y 绿 · Z 蓝</div>
    <label>夹爪姿态</label>
    <div class="row"><button data-grip="0">0 rad</button><button data-grip="0.55">0.55 rad</button><button data-grip="1.1">1.10 rad</button></div>
    <hr>
    <div id="joints"></div>
    <div class="row"><button id="reset">关节复位</button><button id="fit">适配视图</button></div>
    <div class="note">蓝色薄片为旧模型的碰撞包络。安装偏移与抓取中心沿用旧装配，待实物核对。这里的关节操作只改变模型。</div>
  </aside>
  <section id="viewport" aria-label="三维模型视图"><div id="status" role="status">正在加载模型…</div><div id="hint">左键旋转 · 滚轮缩放 · 右键平移</div></section>
</main>
<script type="module" src="viewer.bundle.js"></script>
</body>
</html>
