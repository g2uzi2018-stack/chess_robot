# Overlay for explicitly authorized, local real-hardware acceptance only.
# Load after arm.yaml and home.yaml. Keep enable false in the saved template.
# Supply safety.model_file explicitly using the matching generated geometry.
chess_robot_arm:
  ros__parameters:
    backend: commissioning
    hardware: {enable: false}
    commissioning: {joint_radius_rad: 0.1, tcp_radius_m: 0.03}
    limits:
      velocity_rad_s: [2.36, 2.36, 2.36, 2.36, 2.36, 2.36]
      acceleration_rad_s2: [4.72, 4.72, 4.72, 4.72, 4.72, 4.72]
    profiles:
      default: low
      names: [low, high, commissioning_slow]
      low: {speed_rad_s: 0.708, acceleration_rad_s2: 1.416}
      high: {speed_rad_s: 2.36, acceleration_rad_s2: 4.72}
      commissioning_slow: {speed_rad_s: 0.708, acceleration_rad_s2: 1.416}
    twist: {net_limit_rad: 0.3490658503988659, total_limit_rad: 0.3490658503988659}
    feedback: {freshness_s: 0.1}
    tolerances:
      stationary_rad_s: 0.002
      dwell_s: 0.4
      position_m: 0.001
      rotation_rad: 0.005
      joint_rad: 0.0005
      tracking_rad: 0.15
