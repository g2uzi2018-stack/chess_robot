chess_robot_arm:
  ros__parameters:
    backend: read_only
    test_fixture: false
    # Loopback is deliberate. Supply the controller IPv4 explicitly on AGX.
    controller:
      ip: 127.0.0.1
      dashboard_port: 29999
      feedback_port: 30004
      timeout_ms: 500
    # Nominal URDF transform, NOT a measured physical TCP calibration.
    tcp:
      translation_m: [0.0, 0.0, 0.2]
      rpy_rad: [1.5707963267948966, -1.5707963267948966, 0.0]
    grasp_axis: [1.0, 0.0, 0.0]
    approach_clearance_m: 0.25
    workspace:
      min_m: [-0.8, -0.8, 0.0]
      max_m: [0.8, 0.8, 1.2]
    limits:
      velocity_rad_s: [0.25, 0.25, 0.25, 0.25, 0.25, 0.25]
      acceleration_rad_s2: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
    profiles:
      names: [conservative]
      conservative:
        speed_rad_s: 0.25
        acceleration_rad_s2: 0.5
    capture: {max_age_s: 1.0, future_tolerance_s: 0.05}
    feedback: {freshness_s: 0.25}
    reference:
      home_tolerance_rad: 0.03
      max_joint_step_rad: 0.1
      max_phase_step_rad: 1.5707963267948966
    tolerances:
      downward_rad: 0.15
      stationary_rad_s: 0.01
      dwell_s: 0.3
      position_m: 0.003
      rotation_rad: 0.03
      joint_rad: 0.015
      tracking_rad: 0.15
    twist:
      cost_duration: 1.0
      cost_net: 1.0
      cost_total: 1.0
      cost_energy: 0.01
      net_limit_rad: 6.283185307179586
      total_limit_rad: 6.283185307179586
    sampling:
      joint_step_rad: 0.025
      cartesian_step_m: 0.002
      period_s: 0.03
      max_samples: 20000
    servo: {aheadtime: 50.0, gain: 500.0}
    planning_timeout_s: 30.0
    gripper_timeout_s: 15.0
    arrival_timeout_s: 10.0
    stop_timeout_s: 2.0
    hardware:
      enable: false
      tcp_verified: false
      limits_verified: false
      execution_profile_verified: false
      servoj_certified: false
