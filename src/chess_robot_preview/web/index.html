<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>相机预览</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header class="app-header"><div class="brand-mark" aria-hidden="true">◉</div><div><h1>相机预览</h1><p>CHESS ROBOT · LIVE VIEW</p></div><span class="connection" id="connection">连接中</span></header>
<div class="workspace">
  <aside><div class="list-heading"><h2>图像列表</h2><span id="channel-count">—</span></div><p class="list-hint">选择一路，开始查看</p><nav id="channels" aria-label="可选图像"></nav><div class="sidebar-note"><span class="dot"></span>未选中的图像不加载</div></aside>
  <main><div class="viewer-toolbar"><div><h2 id="view-title">选择图像</h2><p id="view-description">点击左侧任意图像，放大查看</p></div><div class="actions"><button id="pause" disabled>暂停</button><button id="fullscreen" title="全屏查看" disabled>全屏</button></div></div>
    <section class="stage" id="stage" aria-label="图像预览区"><img id="main-image" alt="" hidden><div class="empty" id="empty"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="8" width="36" height="32" rx="4"/><circle cx="18" cy="19" r="3"/><path d="m7 34 11-10 8 7 6-5 10 10"/></svg><h3 id="empty-title">尚未选择图像</h3><p id="empty-description">仅加载你正在查看的画面</p></div><span class="stage-label" id="stage-label" hidden>实时预览</span></section>
    <footer class="viewer-footer"><span class="view-state" id="view-state">等待选择</span><span id="frame-info">图像传输已暂停</span><span id="preview-settings">按需加载</span></footer>
  </main>
</div></body></html>
