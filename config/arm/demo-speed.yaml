# 演示速度与通信配置：扫描、搬运、升降速度和 ServoJ 回执容差在这里修改。
# speed_rad_s：各关节的速度上限，单位 rad/s，不是末端直线速度 m/s。
# acceleration_rad_s2：各关节的加速度上限，单位 rad/s²。
# 实际速度还受加速度、路径和机械臂总限值约束，短行程可能达不到速度上限。
#
# 当前现场启动脚本会在基础配置、桌面接触配置之后加载本文件。
# 修改并保存后，在仓库根目录执行以下命令才会生效：
#   bash tools/pick_stack/run_speed_demo.sh activate
# activate 会重启当前机械臂服务并恢复原检查点，不清零参考或绕转记录。
# 执行前须空爪停在正式 Home，且重启期间没有手动移动或断电。
# 看到 READY_HOME_EMPTY 后，核对输出的速度、加速度与本文件一致。
chess_robot_arm:
  ros__parameters:
    # ServoJ 回执容差：现场记录出现 166～201 ms 的短时延迟。
    # 220 ms 覆盖已记录的抖动；超过此时间仍中止运动，不重发轨迹点。
    # 30 ms 发点周期下最多容纳 8 条待确认指令，避免先撞到旧的 6 条窗口。
    # 这两项只改变回执等待，不提高速度；反馈、跟踪误差和停机保护保持原值。
    servo:
      ack_timeout_s: 0.22           # 单条 ServoJ 指令的最长回执等待，单位秒。
      max_pending: 8                # 未收到回执的指令数量上限，驱动允许最多 8 条。

    profiles:
      # 扫描视点之间移动、空中搬运和回 Home 使用这一组。
      roundtrip_low:
        speed_rad_s: 0.5            # 扫描／空中移动的关节速度上限。
        acceleration_rad_s2: 0.5    # 扫描与空中短行程提速，减少起步和停止耗时。

      # 竖直下降和抬升使用这一组；当前抓放业务会自动选择该配置。
      # 调高此速度也会影响实际抓放，不仅影响空爪竖直往返演示。
      table_contact:
        speed_rad_s: 0.5            # 下降／抬升的关节速度上限。
        acceleration_rad_s2: 0.2    # 升降短行程提速；接触动作需结合夹持和停稳实测。
